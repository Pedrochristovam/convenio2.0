services:
  # ----------------------------------------------------
  # 1. BACKEND (FastAPI + Tesseract + LibreOffice, via Docker)
  # ----------------------------------------------------
  - type: web
    name: convenio2-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Gratuito: 512 MB e 0,1 CPU. O OCR cabe (pico medido ~240 MB), mas é lento;
    # o servidor se mantém acordado sozinho enquanto processa (RENDER_EXTERNAL_URL)
    plan: free
    healthCheckPath: /
    envVars:
      # Usuários de acesso: "ana:senha1,joao:senha2" (sem isso o backend não sobe em produção)
      - key: APP_USERS
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # MySQL externo (o Render só oferece PostgreSQL gerenciado)
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "1"

  # ----------------------------------------------------
  # 2. SITE ESTÁTICO (Frontend React/Vite)
  # ----------------------------------------------------
  - type: web
    name: convenio2-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: convenio2-backend
          property: host
