databases:
  # PostgreSQL gratuito do Render (1 GB). Expira 30 dias após a criação: depois disso,
  # apague-o e crie outro com o mesmo nome (o sistema recria as tabelas sozinho).
  - name: convenio2-db
    plan: free
    databaseName: convenio2
    user: convenio2

services:
  # ----------------------------------------------------
  # 1. BACKEND (FastAPI + Tesseract + LibreOffice, via Docker)
  # ----------------------------------------------------
  - type: web
    name: convenio2-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Gratuito: 512 MB e 0,1 CPU. O OCR cabe (pico medido ~240 MB), mas é lento;
    # o servidor se mantém acordado sozinho enquanto processa (RENDER_EXTERNAL_URL)
    plan: free
    healthCheckPath: /
    envVars:
      # Usuários de acesso: "ana:senha1,joao:senha2" (sem isso o backend não sobe em produção)
      - key: APP_USERS
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: convenio2-db
          property: connectionString

  # ----------------------------------------------------
  # 2. SITE ESTÁTICO (Frontend React/Vite)
  # ----------------------------------------------------
  - type: web
    name: convenio2-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: convenio2-backend
          property: host
