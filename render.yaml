databases:
  # PostgreSQL gratuito do Render (1 GB). Expira 30 dias após a criação: depois disso,
  # apague-o e crie outro com o mesmo nome (o sistema recria as tabelas sozinho).
  - name: convenio2-db
    plan: free
    databaseName: convenio2
    user: convenio2

services:
  # ----------------------------------------------------
  # 1. BACKEND (FastAPI + Tesseract + LibreOffice, via Docker)
  # ----------------------------------------------------
  - type: web
    name: convenio2-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Gratuito: 512 MB e 0,1 CPU. O OCR cabe (pico medido ~240 MB), mas é lento;
    # o servidor se mantém acordado sozinho enquanto processa (RENDER_EXTERNAL_URL)
    plan: free
    healthCheckPath: /
    envVars:
      # Sem login: qualquer pessoa com o endereço acessa. Para ligar o login, crie no painel
      # a variável APP_USERS ("ana:senha1,joao:senha2").
      - key: PERMITIR_SEM_LOGIN
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: convenio2-db
          property: connectionString

  # ----------------------------------------------------
  # 2. SITE ESTÁTICO (Frontend React/Vite)
  # ----------------------------------------------------
  - type: web
    name: convenio2-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      # Endereço público do backend (o "host" do fromService é o da rede interna, que o navegador não alcança)
      - key: VITE_BACKEND_URL
        value: https://convenio2-backend.onrender.com
