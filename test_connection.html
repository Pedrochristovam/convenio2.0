<!DOCTYPE html>
<html>
<head>
    <title>Teste de Conexão - Backend</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Teste de Conexão - Convênio 2.0</h1>
    
    <button onclick="testBackend()">Testar Backend</button>
    <button onclick="testUpload()">Testar Upload (com arquivo pequeno)</button>
    
    <div id="result"></div>
    
    <script>
        async function testBackend() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Testando conexão...</p>';
            
            try {
                const response = await fetch('http://127.0.0.1:58009/test');
                const data = await response.json();
                result.innerHTML = `<p class="success">✅ Backend conectado! ${JSON.stringify(data)}</p>`;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }
        }
        
        async function testUpload() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Criando arquivo de teste...</p>';
            
            // Cria um arquivo de texto pequeno para teste
            const blob = new Blob(['Teste de upload\n31/07/2015 SALDO ANTERIOR 60.820,83\n31/08/2015 SALDO ATUAL 61.290,01'], 
                                  { type: 'text/plain' });
            const file = new File([blob], 'teste.txt', { type: 'text/plain' });
            
            const formData = new FormData();
            formData.append('file', file);
            
            result.innerHTML = '<p>Enviando arquivo de teste...</p>';
            
            try {
                const response = await fetch('http://127.0.0.1:58009/extract', {
                    method: 'POST',
                    body: formData
                });
                
                result.innerHTML = `<p>Status: ${response.status}</p>`;
                
                const data = await response.json();
                result.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                if (response.ok) {
                    result.innerHTML = '<p class="success">✅ Upload funcionou!</p>' + result.innerHTML;
                } else {
                    result.innerHTML = '<p class="error">❌ Erro no upload</p>' + result.innerHTML;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
